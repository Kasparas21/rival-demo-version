<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter Bot</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f4f4f5;
        color: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 520px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      .subtitle {
        margin: 0 0 24px;
        color: #71717a;
        font-size: 0.95rem;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.875rem;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 16px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        font-size: 1rem;
      }

      input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      button {
        width: 100%;
        padding: 12px;
        background: #18181b;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #27272a;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #log {
        margin-top: 24px;
        padding: 16px;
        background: #fafafa;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        min-height: 120px;
        max-height: 280px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8125rem;
        line-height: 1.6;
      }

      .log-line {
        margin: 0 0 4px;
      }

      .log-line.success {
        color: #15803d;
        font-weight: 600;
      }

      .log-line.error {
        color: #b91c1c;
        font-weight: 600;
      }

      .log-time {
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Newsletter Bot</h1>
      <p class="subtitle">Enter a website URL and email — the bot will find and submit the signup form.</p>

      <form id="form">
        <label for="url">Website URL</label>
        <input
          id="url"
          name="url"
          type="url"
          placeholder="https://example.com"
          required
        />

        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          required
        />

        <button type="submit" id="submit-btn">Subscribe</button>
      </form>

      <div id="log" aria-live="polite"></div>
    </div>

    <script>
      const form = document.getElementById("form");
      const logEl = document.getElementById("log");
      const submitBtn = document.getElementById("submit-btn");

      function appendLog(message, type) {
        const line = document.createElement("p");
        line.className = "log-line" + (type ? " " + type : "");
        const time = new Date().toLocaleTimeString();
        line.innerHTML = '<span class="log-time">[' + time + "]</span> " + escapeHtml(message);
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const url = document.getElementById("url").value.trim();
        const email = document.getElementById("email").value.trim();

        logEl.innerHTML = "";
        submitBtn.disabled = true;
        appendLog("Starting...");

        try {
          const response = await fetch("/api/subscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, email }),
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({ error: "Request failed." }));
            appendLog(err.error || "Request failed.", "error");
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";

            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              try {
                const data = JSON.parse(line.slice(6));
                if (data.step === "status") {
                  appendLog(data.message);
                } else if (data.step === "done") {
                  appendLog(data.message, data.success ? "success" : "error");
                } else if (data.step === "error") {
                  appendLog(data.message, "error");
                }
              } catch {
                // ignore malformed lines
              }
            }
          }
        } catch (err) {
          appendLog(err.message || "Network error.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
